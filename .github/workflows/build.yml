name: Frontend build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

      - name: Install native AI dependencies
        run: npm install --no-audit --no-fund
        working-directory: native-ai
      - name: Native AI architecture tests
        run: npm test
        working-directory: native-ai
      - name: Native AI typecheck
        run: npm run typecheck
        working-directory: native-ai
      - name: Native AI production build
        run: npm run build
        working-directory: native-ai
