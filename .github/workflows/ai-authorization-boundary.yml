name: AI authorization boundary

on:
  pull_request:
    paths:
      - "src/lib/ai-engine.server.ts"
      - "scripts/verify-ai-authorization-boundary.mjs"
      - ".github/workflows/ai-authorization-boundary.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify that AI cannot control conversation state
        run: node scripts/verify-ai-authorization-boundary.mjs
